<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>ZKTeco PUSH Tester</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --border: #262c37;
    --text: #d8dee9;
    --muted: #8890a0;
    --accent: #4f9dff;
    --ok: #35c17c;
    --warn: #e0a933;
    --err: #e05a5a;
    --mono: "Consolas", "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--err);
    flex-shrink: 0;
  }
  .dot.connected { background: var(--ok); }
  .status-text { color: var(--muted); }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column-reverse;
  }
  .event {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 8px;
    background: var(--panel);
  }
  .event-head {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .badge {
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .badge.handshake { background: #2a3f66; color: #9dc0ff; }
  .badge.upload { background: #234a36; color: #7fe0b3; }
  .badge.getrequest { background: #3a3320; color: #e0c47f; }
  .badge.devicecmd { background: #3a2440; color: #d79ee8; }
  .badge.command_queued { background: #402424; color: #e89e9e; }
  .badge.encrypted { background: var(--err); color: #fff; }
  .ts { color: var(--muted); }
  .sn { color: var(--accent); font-weight: 600; }
  .path { color: var(--text); }
  .event-body {
    margin-top: 6px;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--muted);
    max-height: 220px;
    overflow-y: auto;
  }
  details { margin-top: 4px; }
  summary { cursor: pointer; color: var(--muted); }
  table.fields { border-collapse: collapse; margin-top: 4px; }
  table.fields td { border: 1px solid var(--border); padding: 2px 6px; color: var(--text); }

  aside {
    width: 320px;
    flex-shrink: 0;
    border-left: 1px solid var(--border);
    background: var(--panel);
    padding: 14px;
    overflow-y: auto;
  }
  aside h2 {
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0 0 10px;
  }
  label {
    display: block;
    color: var(--muted);
    margin-bottom: 4px;
  }
  input, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 6px 8px;
    font-family: var(--mono);
    font-size: 13px;
    margin-bottom: 10px;
    resize: vertical;
  }
  button {
    width: 100%;
    background: #1d2733;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 7px 8px;
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    margin-bottom: 6px;
    text-align: left;
  }
  button:hover { background: #263140; border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { background: #6bacff; }
  hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<header>
  <span class="dot" id="statusDot"></span>
  <h1>ZKTeco PUSH Tester</h1>
  <span class="status-text" id="statusText">conectando...</span>
</header>
<main>
  <div id="log"><div class="empty">Aguardando tráfego do dispositivo...</div></div>
  <aside>
    <h2>Injetar comando</h2>
    <label for="sn">SN do equipamento</label>
    <input id="sn" placeholder="ex: CIWH123456789" />

    <label for="cmd">Comando</label>
    <textarea id="cmd" rows="3" placeholder="ex: REBOOT"></textarea>
    <button class="primary" id="sendCmd">Enviar para a fila</button>

    <hr />
    <h2>Atalhos</h2>
    <button data-cmd="CONTROL DEVICE 01 01 05 00 00">Abrir porta 1 (5s)</button>
    <button data-cmd="DATA QUERY ATTLOG StartTime=2020-01-01 00:00:00\tEndTime=2030-01-01 00:00:00">Consultar ATTLOG</button>
    <button data-cmd="REBOOT">Reiniciar equipamento</button>
  </aside>
</main>
<script>
  const logEl = document.getElementById("log");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  let sawFirstEvent = false;

  function esc(s) {
    return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  }

  function renderFields(records) {
    if (!records || !records.length) return "";
    return records.map(r =>
      `<table class="fields"><tr>${r.fields.map(f => `<td>${esc(f)}</td>`).join("")}</tr></table>`
    ).join("");
  }

  function renderEvent(ev) {
    if (!sawFirstEvent) { logEl.innerHTML = ""; sawFirstEvent = true; }
    const el = document.createElement("div");
    el.className = "event";
    const encBadge = ev.encrypted ? `<span class="badge encrypted">Encrypt≠0</span>` : "";
    let body = "";
    if (ev.response !== undefined) body += `<div class="event-body">${esc(ev.response)}</div>`;
    if (ev.body) body += `<div class="event-body">${esc(ev.body)}</div>`;
    if (ev.records) body += renderFields(ev.records);
    if (ev.parsed) body += `<div class="event-body">${esc(JSON.stringify(ev.parsed))}</div>`;
    if (ev.command) body += `<div class="event-body">command_id=${ev.command_id} → ${esc(ev.command)}</div>`;

    let headersHtml = "";
    if (ev.headers) {
      const relevant = ["host", "content-type", "user-agent"];
      const rows = relevant
        .filter(h => ev.headers[h])
        .map(h => `${h}: ${esc(ev.headers[h])}`)
        .join("\n");
      if (rows) headersHtml = `<details><summary>headers</summary><div class="event-body">${rows}</div></details>`;
    }

    el.innerHTML = `
      <div class="event-head">
        <span class="ts">${esc(ev.ts || "")}</span>
        <span class="badge ${esc(ev.type || "")}">${esc(ev.type || "")}</span>
        ${ev.method ? `<span class="path">${esc(ev.method)} ${esc(ev.path || "")}</span>` : ""}
        ${ev.sn ? `<span class="sn">SN=${esc(ev.sn)}</span>` : ""}
        ${ev.table ? `<span class="path">table=${esc(ev.table)}</span>` : ""}
        ${encBadge}
      </div>
      ${body}
      ${headersHtml}
    `;
    logEl.prepend(el);
    while (logEl.children.length > 500) logEl.removeChild(logEl.lastChild);
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => {
      statusDot.classList.add("connected");
      statusText.textContent = "conectado";
    };
    ws.onclose = () => {
      statusDot.classList.remove("connected");
      statusText.textContent = "desconectado — tentando reconectar...";
      setTimeout(connect, 2000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (msg) => {
      try { renderEvent(JSON.parse(msg.data)); } catch (e) { console.error(e); }
    };
  }
  connect();

  document.querySelectorAll("aside button[data-cmd]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.getElementById("cmd").value = btn.dataset.cmd;
    });
  });

  document.getElementById("sendCmd").addEventListener("click", async () => {
    const sn = document.getElementById("sn").value.trim();
    const command = document.getElementById("cmd").value.trim();
    if (!sn || !command) { alert("Preencha SN e comando."); return; }
    await fetch("/api/commands", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sn, command }),
    });
  });
</script>
</body>
</html>
